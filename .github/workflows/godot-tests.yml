name: Godot regression tests

on:
  pull_request:
    branches: [main, "feat/campaign-*"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: quest_pickup_feedback
            tests: reward_feedback,chest_transaction,pickup_affordance,quest_guidance_feedback
          - suite: equipment_earned_budget
            tests: equipment_earned_budget
          - suite: equipment
            tests: equipment_exploration_migration,equipment_attack_sources,equipment_service,equipment_bag_ui,equipment_domain,equipment_drops,equipment_kill_integration,equipment_combat,equipment_particles,equipment_persistence
          - suite: logic
            tests: sim,frames,balance,warrior_motion_assets,material_rewards,pacing_controller
          - suite: visuals
            tests: ui_visual,menu_layout,animation,actor_alignment,hero_slash_motion
          - suite: flows
            tests: smoke,save,save_lifecycle,kill_save_consistency,player_continuity,combat,ui_flow,projectile,world,pacing
          - suite: gameplay
            tests: enemy_mechanism,gameplay_combat,gameplay_ecology,gameplay_world,gameplay_equipment,gameplay_navigation,tree_edge_contacts,tree_edge_navigation,hunt_eligibility,guard_counter
          - suite: choices
            tests: monster_growth_persistence,boss_age_balance,gameplay_tasks,ecology_feedback,gameplay_choices_ui
          - suite: interaction
            tests: chest_attack_priority,mobile_controls,combat_feedback,town_interaction,quest_clarity,quest_lifecycle,guard_controls
          - suite: camp_pilot
            tests: camp_quest_core,camp_pilot_contract,camp_pilot_lifecycle,six_button_hud
          - suite: outpost_chapter
            tests: outpost_ledger,outpost_layout,outpost_chapter_contract,outpost_chapter_lifecycle,outpost_live_targets,outpost_live_targets_lifecycle
          - suite: campaign
            tests: campaign_reward_contract,campaign_ledger,campaign_layout,campaign_acceptance,campaign_lifecycle
          - suite: campaign_story
            tests: campaign_story_lifecycle
          - suite: campaign_optional
            tests: campaign_optional_geometry,campaign_optional_placements,campaign_service_receipts,campaign_optional_adversarial
          - suite: campaign_optional_lifecycle
            tests: campaign_optional_lifecycle,campaign_regional_passage
          - suite: campaign_optional_outcomes
            tests: campaign_optional_outcomes
          - suite: campaign_dynamic
            tests: campaign_dynamic_truth,campaign_catalog_ledger,campaign_content_contract,campaign_world_facts,campaign_dynamic_host,campaign_dynamic_feasibility,campaign_dynamic_adversarial,campaign_dynamic_save_failure
          - suite: campaign_dynamic_lifecycle
            tests: campaign_dynamic_lifecycle
          - suite: campaign_raw_persistence
            tests: campaign_dynamic_copy_guard,campaign_dynamic_write_through,campaign_dynamic_rock_body
          - suite: campaign_cross_family
            tests: campaign_walk_geometry,campaign_cross_family
          - suite: campaign_resume_mobile
            tests: campaign_resume_navigation,campaign_open_room_restore,mobile_clipping,mobile_scroll,campaign_feedback_layout
          - suite: campaign_earned_budget
            tests: campaign_earned_budget
          - suite: exploration_weapons
            tests: directional_attack,weapon_effects,terrain_coherence,exploration_map,exploration_lifecycle,knockback_response
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete test matrix
        run: python3 Code/tests/validate_ci_coverage.py
      - name: Install official Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip \
            --output godot.zip
          echo 'b639ca9c1ddea39bb3df89bd5283a51ca6047467abe6b25e9436566f2b2082ede633025073989ecf39c7d5d3c2493d80ea13e3af6dd5e261bbf89e462d6d2214  godot.zip' | sha512sum --check
          unzip -q godot.zip
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.suite }} regressions
        run: python3 Code/tests/run_headless.py --only '${{ matrix.tests }}' --log-dir 'test-results/${{ matrix.suite }}'
      - name: Render equipment pixels and mobile layouts
        if: matrix.suite == 'equipment'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          xvfb-run -a python3 Code/tests/run_equipment_visual_test.py "$GODOT" --log-dir test-results/equipment/rendered
      - name: Render quest and pickup mobile feedback
        if: matrix.suite == 'quest_pickup_feedback'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          xvfb-run -a python3 Code/tests/run_quest_pickup_visual_test.py "$GODOT" --log-dir test-results/quest_pickup_feedback/rendered
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-${{ matrix.suite }}-logs
          path: test-results/${{ matrix.suite }}
          if-no-files-found: warn
